spring:
  application:
    name: hogar
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger/OpenAPI UI solo en el perfil `local` (ver application-local.yml)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
