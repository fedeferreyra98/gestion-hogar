name: Smoke E2E

# Opcional: NO es un check requerido de main. Se corre a mano (workflow_dispatch)
# o agregando la etiqueta `run-smoke` a un PR. Usa solo credenciales mock de desarrollo
# (las mismas de .env.example); ver docs/07-sensitive-data.md.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke E2E
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hogar
          POSTGRES_USER: hogar
          POSTGRES_PASSWORD: hogar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hogar -d hogar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales de desarrollo mock (idénticas a .env.example)
      DB_NAME: hogar
      DB_USER: hogar
      DB_PASSWORD: hogar
      DB_PORT: 5432
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      JWT_SECRET: dev-only-secret-change-me-dev-only-secret-change-me
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEV_OWNER_EMAIL: owner@hogar.local
      DEV_OWNER_PASSWORD: dev-owner-password-123
      DEV_OWNER_NAME: OwnerDev
      DEV_HOUSEHOLD_NAME: HogarDev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend

      - name: Start backend
        working-directory: backend
        run: |
          nohup ./gradlew bootRun > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf "http://localhost:${SERVER_PORT}/actuator/health" >/dev/null && exit 0
            sleep 2
          done
          echo "El backend no arrancó a tiempo"; tail -n 100 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Seed
        run: ./scripts/seed.sh

      - name: Smoke
        run: ./scripts/smoke.sh

      - name: Backend log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/backend.log" || true
